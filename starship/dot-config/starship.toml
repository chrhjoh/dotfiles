add_newline = false
palette = "rose_pine"


[cmd_duration]
disabled = true

[conda]
format = "[$symbol$environment]($style) "

[directory]
style = "bold subtle"

[git_branch]
format = "on [$symbol$branch(:$remote_branch)]($style) "
style = "bold iris"

[git_status]
style = "bold iris"

[palettes.rose_pine]
base = "#191724"
surface = "#1f1d2e"
overlay = "#26233a"
muted = "#6e6a86"
subtle = "#908caa"
text = "#e0def4"
love = "#eb6f92"
gold = "#f6c177"
rose = "#ebbcba"
pine = "#31748f"
foam = "#9ccfd8"
iris = "#c4a7e7"
highlight-low = "#21202e"
highlight-med = "#403d52"
highlight-high = "#524f67"


[python]
symbol = " "
style = "bold yellow"
format = '[$symbol( $version) ]($style) '

[rust]
format = "[$symbol ($version)]($style) "
style = "bold love"
symbol = " "
